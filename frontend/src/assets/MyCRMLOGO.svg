<?xml version="1.0" encoding="UTF-8"?>
<svg width="540" height="150" viewBox="0 0 540 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Modern blue & teal gradient -->
    <linearGradient id="luxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1">
        <animate attributeName="stop-color"
                 values="#0369A1;#06B6D4;#0369A1"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color"
                 values="#06B6D4;#0891B2;#06B6D4"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0284C7">
        <animate attributeName="stop-color"
                 values="#0284C7;#0369A1;#0284C7"
                 dur="6s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Subtle glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0369A1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Subtle background glow circles -->
  <circle cx="480" cy="35" r="40" fill="#0369A1" opacity="0.04">
    <animate attributeName="r" values="40;50;40" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="430" cy="120" r="30" fill="#06B6D4" opacity="0.04">
    <animate attributeName="r" values="30;38;30" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Neural icon -->
  <g transform="translate(38,34)" filter="url(#shadow)">
    <!-- Connection lines -->
    <path d="M30 40 L70 15 L110 40 L70 65 Z"
          stroke="url(#luxGradient)"
          stroke-width="4"
          stroke-linecap="round"
          fill="none"
          opacity="0.95">
      <animate attributeName="stroke-dasharray"
               values="0,280;280,0"
               dur="3s"
               repeatCount="indefinite"/>
    </path>

    <!-- Nodes -->
    <circle cx="30" cy="40" r="8" fill="#0369A1" filter="url(#glow)">
      <animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="70" cy="15" r="8" fill="#06B6D4" filter="url(#glow)">
      <animate attributeName="r" values="8;12;8" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="110" cy="40" r="8" fill="#0284C7" filter="url(#glow)">
      <animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="70" cy="65" r="8" fill="#0891B2" filter="url(#glow)">
      <animate attributeName="r" values="8;12;8" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Center pulse -->
    <circle cx="70" cy="40" r="5" fill="#06B6D4">
      <animate attributeName="r" values="5;15;5" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main text -->
  <text x="175" y="88"
        font-family="Poppins, Arial, Helvetica, sans-serif"
        font-size="42"
        font-weight="700"
        fill="url(#luxGradient)"
        filter="url(#glow)">
    SynapseCRM
    <animateTransform attributeName="transform"
                      type="translate"
                      values="0 0; 0 -1; 0 0"
                      dur="3s"
                      repeatCount="indefinite"/>
  </text>

  <!-- Elegant underline -->
  <rect x="178" y="103" width="210" height="4" rx="3" fill="url(#luxGradient)" opacity="0.95">
    <animate attributeName="width"
             values="110;210;110"
             dur="3.5s"
             repeatCount="indefinite"/>
  </rect>

</svg>
